# Prometheus configuration for the COST-OPTIMIZED EC2 demo profile.
#
# This file is separate from monitoring/prometheus/prometheus.yml (the
# Kubernetes/scraping reference configuration) so the learning/demo Kubernetes
# setup keeps working unchanged.
#
# Activated only with:
#   docker compose -f docker-compose.prod.yml --profile monitoring up -d
#
# On a 2 GiB t4g.small the retention and storage are deliberately tiny.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus itself - always available, gives you `up` and scrape health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Nginx traffic statistics, translated from stub_status by the exporter.
  - job_name: nginx
    metrics_path: /metrics
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Grafana exposes its own operational metrics.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
