name: ecommerce-demo

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - ecommerce-network
  security_opt:
    - no-new-privileges:true

services:
  frontend:
    <<: *service-defaults
    build: ./services/frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:4000
      SEARCH_URL: http://search:5000
      PRODUCT_URL: http://product:4500
    depends_on:
      backend:
        condition: service_healthy
      search:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    <<: *service-defaults
    build: ./services/backend
    environment:
      NODE_ENV: production
      PORT: 4000
      PAYMENT_URL: http://payment:4200
    depends_on:
      payment:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  payment:
    <<: *service-defaults
    build: ./services/payment
    environment:
      NODE_ENV: production
      PORT: 4200
      PRODUCT_URL: http://product:4500
      VODAFONE_CASH_NUMBER: ${VODAFONE_CASH_NUMBER:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      RECEIPTS_LOCAL_PATH: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - receipts:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4200/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  cart:
    <<: *service-defaults
    build: ./services/cart
    environment:
      NODE_ENV: production
      PORT: 4300
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4300/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  product:
    <<: *service-defaults
    build: ./services/product
    environment:
      NODE_ENV: production
      PORT: 4500
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4500/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *service-defaults
    build: ./services/api
    environment:
      NODE_ENV: production
      PORT: 4600
      FRONTEND_URL: http://frontend:3000
      BACKEND_URL: http://backend:4000
      PAYMENT_URL: http://payment:4200
      SEARCH_URL: http://search:5000
      CART_URL: http://cart:4300
      PRODUCT_URL: http://product:4500
    depends_on:
      backend:
        condition: service_healthy
      cart:
        condition: service_healthy
      product:
        condition: service_healthy
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4600/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  search:
    <<: *service-defaults
    build: ./services/search
    environment:
      NODE_ENV: production
      PORT: 5000
      PRODUCT_URL: http://product:4500
    depends_on:
      product:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    <<: *service-defaults
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

networks:
  ecommerce-network:
    driver: bridge

volumes:
  receipts:
