# Default plain-HTTP server. Present in every deployment, including after a
# certificate is installed (it still answers ACME renewals and any request that
# arrives with an unexpected Host header).
#
# When scripts/aws/setup-https.sh runs it adds conf.d/443-ssl.conf, whose
# server_name wins for the real domain and redirects 80 -> 443.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    add_header X-Content-Type-Options "nosniff"                            always;
    add_header X-Frame-Options        "SAMEORIGIN"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header X-Robots-Tag           "noindex"                            always;

    limit_conn addr 60;

    # Nginx liveness for scripts/smoke-test.sh and the `ecommerce-health` helper.
    location = /nginx-health {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nginx stub_status, consumed by the optional nginx-prometheus-exporter
    # container (`--profile monitoring`). Restricted to Docker/private ranges so
    # the public internet can never read traffic statistics.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # ACME HTTP-01 challenge directory. Served straight off disk, so certificate
    # issuance and renewal never depend on the application containers.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        allow        all;
    }

    # ---------------------------------------------------------------------
    # API traffic. Everything under /api/ goes to the API gateway, which fans
    # out to the other services by Docker service name. This is what makes the
    # required routes work through the public entry point:
    #
    #   /api/health     -> backend
    #   /api/products   -> product
    #   /api/search     -> search
    #   /api/cart/*     -> cart
    #   /api/payments/* -> payment
    #   /api/admin/*    -> payment (owner dashboard)
    #
    # proxy_pass has no URI part, so the original request URI is forwarded
    # unchanged.
    # ---------------------------------------------------------------------
    location /api/ {
        limit_except GET HEAD POST DELETE OPTIONS {
            deny all;
        }

        include /etc/nginx/conf-src/snippets/proxy-common.conf;

        proxy_pass              http://api_gateway;
        proxy_set_header        Accept-Encoding gzip;

        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;
        proxy_buffering         on;
        # Stream multipart receipt uploads instead of buffering 5 MB to disk.
        proxy_request_buffering off;

        # Never leak upstream error pages or stack traces.
        proxy_intercept_errors  on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header   Cache-Control "no-store" always;
        return       503 '{"error":"Service temporarily unavailable"}';
    }

    # Storefront, owner dashboard and hashed static assets.
    location / {
        include /etc/nginx/conf-src/snippets/proxy-common.conf;
        proxy_pass http://frontend_app;
    }

    # Long-lived caching for storefront product imagery and fonts.
    location ^~ /assets/ {
        include /etc/nginx/conf-src/snippets/proxy-common.conf;

        proxy_pass http://frontend_app;
        expires    7d;

        # This block declares add_header, so the server-level security headers
        # are no longer inherited - restate the ones that matter here.
        add_header Cache-Control          "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
