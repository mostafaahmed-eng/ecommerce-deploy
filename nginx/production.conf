# Production reverse proxy main configuration - low-cost EC2 profile.
#
# Mounted read-only at /etc/nginx/nginx.conf by docker-compose.prod.yml.
# Server blocks live in nginx/conf.d/ so the HTTP and HTTPS variants share one
# copy of the location rules instead of drifting apart:
#
#   conf.d/00-default.conf   -> always present, plain HTTP
#   conf.d/443-ssl.conf      -> written by scripts/aws/setup-https.sh
#
# Nginx is the ONLY container publishing host ports (80 / 443).

user             nginx;
worker_processes auto;
error_log        /var/log/nginx/error.log warn;
pid              /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Information disclosure ------------------------------------------------
    # Removing the nginx version banner entirely needs the headers-more module,
    # which the stock nginx image does not ship, so we only suppress the
    # application-level headers we actually control.
    server_tokens    off;
    proxy_hide_header X-Powered-By;

    # --- Logging ---------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    # --- Performance -----------------------------------------------------------
    sendfile                 on;
    tcp_nopush               on;
    keepalive_timeout        65;
    types_hash_max_size      2048;
    server_names_hash_bucket_size 128;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/json application/xml+rss
                      application/woff2 image/svg+xml;

    # --- Request limits --------------------------------------------------------
    # The application caps receipt uploads at 5 MB; 8 MB leaves room for the
    # multipart boundary and form fields without inviting abuse.
    client_max_body_size         8m;
    client_body_buffer_size      128k;
    client_header_buffer_size    16k;
    large_client_header_buffers  4 16k;
    client_body_timeout          60s;
    send_timeout                 60s;
    reset_timedout_connection    on;

    # --- Per-connection guard against slowloris style holds ---------------------
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # --- WebSocket upgrade -----------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Upstreams (Docker service DNS - never hard-coded container IPs) -------
    upstream frontend_app {
        server frontend:3000;
        keepalive 16;
    }

    upstream api_gateway {
        server api:4600;
        keepalive 16;
    }

    include /etc/nginx/conf-src/conf.d/*.conf;
}
